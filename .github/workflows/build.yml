name: Build

# Publishing is release-driven: tag the repo (or create a GitHub
# Release, which creates the tag) as YYYY.MM.DD or YYYY.MM.DD.XX — the
# optional XX counts extra builds within a day (2026.07.28,
# 2026.07.28.01, ...). The tag becomes the image tag on ghcr, plus
# :latest. Pushes and PRs only validate.

on:
  push:
    branches: [main]
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9]'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Lint shell scripts
        # profile.d is in the list because it ships EXECUTED shell: an
        # SC2155 there went unnoticed for exactly as long as the glob
        # omitted it.
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shopt -s globstar nullglob
          for f in system/usr/libexec/mybox/* system/usr/local/bin/mybox \
                   system/etc/profile.d/*.sh gaming/system/usr/libexec/mybox/*; do
            [ -f "$f" ] || continue
            shellcheck -S warning "$f"
          done

      - name: Build image
        # Revision/version labels answer "which commit built this image"
        # straight from the registry (skopeo inspect / podman inspect).
        run: |
          podman build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            -t "$IMAGE:latest" .

      - name: Smoke test
        run: |
          podman run --rm "$IMAGE:latest" bash -ec '
            /usr/lib/systemd/systemd --version
            test -d /usr/share/factory/etc
            test -d /usr/share/factory/var
            test -x /usr/local/bin/mybox
            test -x /usr/libexec/mybox/user-setup

            # PID 1 is the pre-init that assembles the root trees; if it
            # is missing or not executable the container cannot boot at
            # all, and /.mybox is where every overlay upper is expected.
            test -x /usr/libexec/mybox/preinit
            test -d /.mybox

            # Enablement is baked at build time, so its absence is a
            # build bug, not a runtime surprise.
            test -L /usr/share/factory/etc/systemd/user/default.target.wants/mybox-host-sockets.service
            test -L /usr/share/factory/etc/systemd/user/default.target.wants/mybox-xwayland.path
            test -x /usr/bin/xwayland-satellite
            test -L /usr/share/factory/etc/systemd/system/multi-user.target.wants/mybox-user-setup.service

            # sysusers ran at build time, so declared accounts exist in
            # the /etc that every box overlays.
            getent passwd qemu >/dev/null

            # Unit files parse. systemd-analyze exits non-zero on any
            # error, which is the whole point of running it here.
            systemd-analyze verify \
              /usr/lib/systemd/system/mybox-*.service \
              /usr/lib/systemd/system/flatpak-setup.service \
              /usr/lib/systemd/system/proc-unmask.service
          '

      - name: Validate the quadlet
        # mybox.container carries the mandatory state binds, so a syntax
        # error in it breaks every box at once. Every drop-in is loaded
        # alongside it: none of them conflicts with another.
        #
        # quadlet comes from the image we just built, NOT the runner: the
        # ubuntu-24.04 runner ships none, and its path is distro-specific.
        run: |
          podman run --rm --security-opt label=disable -v "$PWD:/src:ro" \
            --entrypoint bash "$IMAGE:latest" -ec '
              mkdir -p /tmp/q/mybox.container.d
              cp /src/mybox.container /tmp/q/
              cp /src/container/*.conf /tmp/q/mybox.container.d/
              QUADLET_UNIT_DIRS=/tmp/q /usr/lib/podman/quadlet -user -dryrun > /tmp/q.out

              # Persistence is not optional: the single state bind carries
              # every overlay upper, and the data trees are bound beside it.
              grep -q -- "-v /srv/users/%U/%p:/.mybox " /tmp/q.out
              for d in home srv; do
                grep -q -- "-v /srv/users/%U/%p/$d:/$d " /tmp/q.out
              done

              # Box root must not be the owning account, and PID 1 must be
              # box root running the pre-init, or nothing is overlaid.
              grep -q -- "--userns keep-id:uid=1000,gid=1000" /tmp/q.out
              grep -q -- "--user 0:0" /tmp/q.out
              grep -q "libexec/mybox/preinit" /tmp/q.out
            '

      - name: Build gaming image
        run: |
          podman build \
            --build-arg BASE="$IMAGE:latest" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            -t "$IMAGE-gaming:latest" gaming

      - name: Smoke test gaming image
        run: |
          podman run --rm --entrypoint bash "$IMAGE-gaming:latest" -ec '
            test -x /usr/libexec/mybox/nvidia32
            test -L /etc/systemd/system/multi-user.target.wants/mybox-nvidia32.service
            pacman -Q steam umu-launcher gamescope lib32-vulkan-icd-loader >/dev/null
            systemd-analyze verify /usr/lib/systemd/system/mybox-nvidia32.service
          '

      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          podman tag "$IMAGE:latest" "$IMAGE:$TAG"
          podman login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          podman push "$IMAGE:$TAG"
          podman push "$IMAGE:latest"
          podman tag "$IMAGE-gaming:latest" "$IMAGE-gaming:$TAG"
          podman push "$IMAGE-gaming:$TAG"
          podman push "$IMAGE-gaming:latest"
