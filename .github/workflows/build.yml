name: Build

# Publishing is release-driven: tag the repo (or create a GitHub
# Release, which creates the tag) as YYYY.MM.DD.XX — XX counts builds
# within a day (2026.07.28.01, 2026.07.28.02, ...). The tag becomes the
# image tag on ghcr, plus :latest. Pushes and PRs only validate.

on:
  push:
    branches: [main]
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9]'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: |
          podman build -t "$IMAGE:latest" .

      - name: Smoke test
        run: |
          podman run --rm "$IMAGE:latest" /usr/lib/systemd/systemd --version
          podman run --rm "$IMAGE:latest" test -d /usr/share/factory/etc
          podman run --rm "$IMAGE:latest" test -d /usr/share/factory/var
          podman run --rm "$IMAGE:latest" test -x /usr/local/bin/mybox
          podman run --rm "$IMAGE:latest" test -x /usr/libexec/mybox/user-setup

      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          podman tag "$IMAGE:latest" "$IMAGE:$TAG"
          podman login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          podman push "$IMAGE:$TAG"
          podman push "$IMAGE:latest"
