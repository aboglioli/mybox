# boot — start the box with its owner's user manager.
#
# For a box that should be up without a desktop session: the isolated
# account (README "Isolated box"), or your own account with linger on
# (`loginctl enable-linger`). Linger starts the user manager at boot, and
# default.target with it.
#
# Not with 10-gui.conf: default.target is reached before the compositor
# creates its sockets, and podman hard-fails a start on a missing bind
# source.

[Install]
WantedBy=default.target
