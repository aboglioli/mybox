# mybox drop-in: persist-root — persistent rootfs state across
# recreation.
#
# THE fix for "quadlet containers are cattle": quadlet's generated
# service removes the container on every stop/daemon-reload/boot.
# This drop-in binds the writable state trees from /srv/<name> so
# everything a running system mutates survives recreation:
#
#   /srv/<name>/etc → /etc   seeded on first boot from /usr/share/factory/etc by
#                            mybox-etc-seed.service (image factory)
#   /srv/<name>/var → /var   seeded on first boot from /usr/share/
#                            factory/var by mybox-var-seed.service —
#                            carries the pacman db AND the writable
#                            /usr + /opt overlay upperdirs that
#                            mybox-usr-overlay.service mounts at boot
#                            (upper lives at /var/lib/mybox/overlay)
#
# So pacman installs, `mybox install-nvidia`, systemctl enables, /etc
# edits — all land under /srv/<name> and outlive the container.
#
# Why not podman's own overlay-at-/ (`Volume=vol:/:O,upperdir=…`):
# broken under --userns=auto (crun cannot reach the merge mount from
# the auto userns — github.com/containers/podman/issues/23211), and
# keep-id/no-userns would gut the isolation model. In-container
# overlays + seeded binds achieve the same with native mechanisms.
#
# Lifecycle:
#   image rebase    just build (or pull) → systemctl restart <name>
#                   /usr lower = the LIVE image, so the new image
#                   applies immediately; /etc, /var and the /usr diff
#                   persist on top (diff shadows only touched paths)
#   factory reset   stop → sudo rm -rf /srv/<name>/{etc,var} → start
#                   (seeds repopulate from the image factories; home
#                   untouched)
#   reset /usr only stop → sudo rm -rf /srv/<name>/var/lib/mybox/
#                   overlay → start (drops pacman/nvidia installs but
#                   keeps the rest of /var — beware pacman db still
#                   lists them; prefer the full factory reset)
#
# `:idmap` keeps host-side ownership at the container's numeric UIDs
# (host UID 1000 files appear as container UID 1000 and vice versa).
# First boot arrives with EMPTY /etc — the /usr-side target drop-ins
# (sysinit.target.d/50-mybox-state.conf) guarantee the seeds still
# run; every later boot uses the seeded presets normally.

[Container]
Volume=/srv/%p/etc:/etc:idmap
Volume=/srv/%p/var:/var:idmap

[Service]
ExecStartPre=/usr/bin/mkdir -p /srv/%p/etc /srv/%p/var
# HOST-SIDE first-boot seeding (a throwaway container copies the image
# factories out). Without it the first boot would start with an empty
# /etc — no machine-id, no preset symlinks, no mask symlinks — and
# PID 1 evaluates those BEFORE any in-container seed unit can run
# (systemd-firstboot fires, masked units wake up). Pre-seeding gives
# the very first boot a fully populated /etc; the in-container seed
# services remain as no-ops / for incus + nspawn. Adjust the image
# reference if this box runs something other than localhost/mybox.
# The seed container runs WITHOUT userns/idmap on purpose: it writes
# the factory trees with their real numeric uids (root-owned on the
# host), and the main container then views them through its own
# `:idmap` binds as the same numeric uids. (`:idmap` on the seed run
# itself would invert the mapping and EACCES.)
# label=disable matches the main container (SELinux-enforcing hosts:
# container_t may not write /srv otherwise).
ExecStartPre=/bin/sh -c 'test -n "$(ls -A /srv/%p/etc)" || podman run --rm --security-opt label=disable -v /srv/%p/etc:/seed localhost/mybox:latest cp -a /usr/share/factory/etc/. /seed/'
ExecStartPre=/bin/sh -c 'test -n "$(ls -A /srv/%p/var)" || podman run --rm --security-opt label=disable -v /srv/%p/var:/seed localhost/mybox:latest cp -a /usr/share/factory/var/. /seed/'
