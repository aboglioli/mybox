# persist-root — persistent /etc + /var across container recreation.
#
# Quadlet removes the container on every stop/reload/boot; this binds
# the writable state from /srv/<name> so pacman installs, systemctl
# enables and /etc edits survive. /var also carries the /usr + /opt
# overlay upperdirs that mybox-usr-overlay.service mounts at boot.
#
# Why not podman's own overlay-at-/ (`Volume=vol:/:O,upperdir=…`):
# broken under --userns=auto (github.com/containers/podman/issues/23211),
# and dropping the userns would gut the isolation model.
#
# Lifecycle:
#   image rebase    rebuild/pull → restart (/usr lower is the live image)
#   factory reset   stop → sudo rm -rf /srv/<name>/{etc,var} → start
#
# `:idmap` keeps host-side ownership at the container's numeric UIDs.

[Container]
Volume=/srv/%p/etc:/etc:idmap
Volume=/srv/%p/var:/var:idmap

[Service]
ExecStartPre=/usr/bin/mkdir -p /srv/%p/etc /srv/%p/var
# HOST-SIDE first-boot seeding via a throwaway container. PID 1 reads
# /etc (machine-id, preset/mask symlinks) before any in-container seed
# unit could run, so an empty bind must be populated beforehand; the
# in-container seed services remain as fallback. The seed run is
# deliberately WITHOUT userns/idmap — it writes real numeric uids that
# the main container then views through its own :idmap binds (`:idmap`
# here would invert the mapping and EACCES). label=disable matches the
# main container. Adjust the image reference if you build another tag.
ExecStartPre=/bin/sh -c 'test -n "$(ls -A /srv/%p/etc)" || podman run --rm --security-opt label=disable -v /srv/%p/etc:/seed ghcr.io/aboglioli/mybox:latest cp -a /usr/share/factory/etc/. /seed/'
ExecStartPre=/bin/sh -c 'test -n "$(ls -A /srv/%p/var)" || podman run --rm --security-opt label=disable -v /srv/%p/var:/seed ghcr.io/aboglioli/mybox:latest cp -a /usr/share/factory/var/. /seed/'
