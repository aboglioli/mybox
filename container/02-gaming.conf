# gaming — run the gaming variant: Steam, Proton (umu-launcher),
# gamescope, mangohud, gamemode and the 32-bit GPU stack, on top of
# everything the base has. Built from gaming/Containerfile.
#
# Same box, different image: switching an existing box over keeps its
# state, and the packages the variant adds simply appear in /usr.
#
# Pair with 20-gpu.conf and, on NVIDIA, 30-nvidia.conf.

[Container]
Image=ghcr.io/aboglioli/mybox-gaming:latest
