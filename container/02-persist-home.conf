# mybox drop-in: persist-home — /srv/<name>/home bound at /home.
#
# Whole /home (not /home/<user>) so the runtime-configured user —
# whatever mybox-user-setup.service names it — gets its dir created
# by `useradd -m` INSIDE the bind. Username changes need no new mount.
#
# Bare `:idmap` translates through the container userns: container
# UID 1000 files land on the host as UID 1000 (your host user) —
# host-visible, host-editable. Root-owned /srv/<name>/home top dir is
# fine: only the per-user subdir needs user ownership and useradd
# creates it inside the container.
#
# Kept OUT of the root overlay on purpose: home outlives factory
# resets and image rebases, and idmap keeps host-side ownership sane
# (overlay upper files land in the high userns range instead).

[Container]
Volume=/srv/%p/home:/home:idmap

[Service]
ExecStartPre=/usr/bin/mkdir -p /srv/%p/home
