# persist-home — /srv/<name>/home bound at /home.
#
# Whole /home (not /home/<user>) so `useradd -m` creates whatever user
# mybox-user-setup.service is configured with inside the bind.
#
# Kept OUT of the root overlay on purpose: home outlives factory resets
# and rebases, and `:idmap` keeps host-side ownership at the same
# numeric UIDs (container UID 1000 files land as host UID 1000).

[Container]
Volume=/srv/%p/home:/home:idmap

[Service]
ExecStartPre=/usr/bin/mkdir -p /srv/%p/home
