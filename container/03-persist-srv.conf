# mybox drop-in: persist-srv — /srv/<name>/srv bound at /srv.
#
# Service data for nested workloads: nested quadlet containers (game
# servers, web apps — e.g. containers/services/games/valheim.container
# with Volume=/srv/users/%U/...) keep their volumes under the
# container's /srv, which lands host-side at /srv/<name>/srv/ and
# survives recreation like the rest of the state tree.
#
# No seeding needed — /srv starts empty by design; the image's
# tmpfiles.d creates /srv/users at boot and mybox-user-setup.service
# provisions /srv/users/<uid> owned by the runtime user (so rootless
# nested podman can create volume dirs there).
#
# On Btrfs make /srv/<name>/srv its own subvolume if you want to
# snapshot service data independently of etc/var.

[Container]
Volume=/srv/%p/srv:/srv:idmap

[Service]
ExecStartPre=/usr/bin/mkdir -p /srv/%p/srv
