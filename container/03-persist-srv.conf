# persist-srv — /srv/<name>/srv bound at /srv.
#
# Service data for nested quadlets (game servers, web apps keeping
# volumes under /srv/users/%U/...). No seeding — /srv starts empty;
# mybox-user-setup.service provisions /srv/users/<uid> owned by the
# runtime user so rootless nested podman can create volume dirs.

[Container]
Volume=/srv/%p/srv:/srv:idmap

[Service]
ExecStartPre=/usr/bin/mkdir -p /srv/%p/srv
