# mybox drop-in: user — runtime-configured login user.
#
# The image bakes NO user. mybox-user-setup.service (inside) creates
# one at boot from these env vars; podman env reaches systemd units
# via PID 1. Omit this drop-in entirely for the defaults
# (user / 1000 / 1000 / /usr/bin/fish).
#
# With 01-persist-root.conf the user record persists in the root
# overlay — created once, survives recreation. Changing MYBOX_USER
# later creates a SECOND user (the old one stays); changing MYBOX_UID
# after first boot does NOT rechown existing home files.
#
# File-based alternative (host path, must exist before start):
# comment the Environment= lines and use
#   EnvironmentFile=/srv/%p/container.env
# — see mybox/container.env.example.

[Container]
Environment=MYBOX_USER=user
Environment=MYBOX_UID=1000
Environment=MYBOX_GID=1000
Environment=MYBOX_SHELL=/usr/bin/fish
