# Runtime login user. The image bakes NO user — mybox-user-setup.service
# creates it at boot from these env vars (podman env reaches units via
# PID 1). Omit this drop-in for the defaults shown below.
#
# The user record lives in the persistent /etc bind.
# Changing MYBOX_USER later creates a SECOND user, UNLESS MYBOX_UID is
# still held by the first one — then creation is skipped and group
# binding retargets to whoever owns the uid. Changing MYBOX_UID after
# first boot does NOT rechown existing home files.
#
# File-based alternative: comment the Environment= lines and use
#   EnvironmentFile=/srv/%p/container.env
# (see container.env.example).

[Container]
Environment=MYBOX_USER=user
Environment=MYBOX_UID=1000
Environment=MYBOX_GID=1000
Environment=MYBOX_SHELL=/usr/bin/fish

# SSH keys for the user, comma-separated — synced every boot to
# /etc/ssh/authorized_keys.d/<user> (sshd reads it alongside
# ~/.ssh/authorized_keys). Handy when env comes from CI or secrets.
# Environment=MYBOX_AUTHORIZED_KEYS=ssh-ed25519 AAAA... you@host

# Local alternative: bind-mount a host file instead of env.
# Volume=/srv/%p/authorized_keys:/etc/ssh/authorized_keys.d/user:ro
