# gui-guard — keeps the HEADLESS instance out of the way of the GUI one.
#
# Installs into <name>@headless.container.d/, not the shared dir: it is
# part of the 10-gui feature and must not exist without it. `just install`
# copies it exactly when 10-gui is in the drop-in set.
#
# Why it is needed. <name>@gui hands the box back with OnSuccess=, and
# systemd fires that on ANY stop — including the stop half of
# `systemctl restart <name>@gui`. Without this condition every GUI restart
# wakes the headless instance mid-restart, and since the two share
# ContainerName and quadlet adds --replace, they then delete each other's
# container, exit 137, and Restart= turns that into a loop.
#
# With it, the socket decides: still there during a restart, so this
# instance is skipped; gone at logout, so it starts for real.
#
# Why it must NOT be installed on a headless box: there would be no GUI
# instance to hold the box, and any machine that happens to run a desktop
# session would never start mybox at all.
#
# The glob matches the same thing <name>@gui.path watches, so the two
# always agree on who should be holding the box — and neither file names a
# uid or a compositor's socket number. On a machine where a SECOND user's
# graphical session should not hand this box over, narrow it to your uid.

[Unit]
ConditionPathExistsGlob=!/run/user/*/wayland-*
