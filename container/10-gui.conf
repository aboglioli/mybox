# gui — the box as a client of your desktop: its apps draw on the host
# compositor and play through the host's pipewire.
#
# Needs host/mybox-gui.service (`just install` puts it in place): it hard
# links the session's wayland, pipewire and pulse sockets into
# %t/mybox-gui when the session starts and removes them when it ends.
# This binds that DIRECTORY, so the box starts with or without a session
# and the GUI comes and goes inside it — boot headless, take the GUI at
# login, survive logout, follow a compositor restart, no box restart.
#
# Works only when the box runs under the desktop account itself — the
# sockets are that account's, and keep-id makes the box user the same uid.
#
# Bound at /mnt/host, NOT /run/user/<uid>: the container's logind
# re-mounts /run/user/<uid> as a fresh tmpfs at session start, shadowing
# anything bound there. mybox-host-sockets.service (user scope) symlinks
# the sockets into $XDG_RUNTIME_DIR after logind.
#
# No X11 socket — the host keeps :0 only as an abstract socket
# (netns-scoped, unreachable). X11 apps get Xwayland INSIDE the box
# (mybox-xwayland.path starts it once the wayland socket is there).
#
# If `pipewire` runs inside, its own pipewire-0 shadows the host link —
# the image keeps the user socket disabled for that reason.

[Container]
Volume=%t/mybox-gui:/mnt/host

# Set in the container env as well as /etc/environment.d/gui.conf: only
# fish sessions and the systemd user manager read environment.d, so a
# plain `podman exec … bash` would otherwise see none of it.
Environment=WAYLAND_DISPLAY=wayland-1
Environment=XDG_SESSION_TYPE=wayland
Environment=DISPLAY=:0

[Service]
# The bind source must exist even before the first session.
ExecStartPre=/usr/bin/mkdir -p %t/mybox-gui/pulse
