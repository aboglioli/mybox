# mybox drop-in: gui — host wayland / pipewire / pulse sockets.
#
# Parallel to incus `gui` profile + mybox.nspawn's [Files] block.
#
# Sockets bind under /mnt/host, NOT /run/user/<uid>: the container's
# own logind re-mounts /run/user/<uid> as a fresh tmpfs at user-session
# start (`just login`, ssh, machinectl), SHADOWING anything bound
# there. The baked mybox-host-sockets.service (user scope, gated on
# /mnt/host/*) symlinks /mnt/host/* into $XDG_RUNTIME_DIR AFTER logind,
# so wayland/pulse/pipewire resolve at the standard paths and survive.
#
# NEVER bind the host session bus ($HOST_RT/bus): link-host-sockets
# would symlink it over the container's OWN user D-Bus, breaking nested
# rootless podman (crun's systemd cgroup manager) and everything else
# on the bus. The container runs its own bus.
#
# Wayland socket name varies by host compositor:
#   niri / sway      → wayland-1
#   GNOME / KDE      → wayland-0
# Edit the Volume= lines + WAYLAND_DISPLAY below to match. Host paths
# assume the host user is UID 1000 (adjust /run/user/1000 otherwise);
# in-container paths assume the runtime user is UID 1000 (MYBOX_UID).
#
# No X11 socket bind. The host compositor keeps :0 only as an ABSTRACT
# socket (netns-scoped, unreachable from the container). For X11 apps
# run Xwayland INSIDE: install xorg-xwayland + xwayland-satellite and
# start mybox-xwayland.service (user) → DISPLAY=:0.
#
# Audio uses the PULSE socket (PULSE_SERVER). If `pipewire` is
# installed inside, mask its user pipewire.socket/pipewire.service —
# else it creates an EMPTY pipewire-0 that shadows the host link.

[Container]
Volume=/run/user/1000/wayland-1:/mnt/host/wayland-1:idmap
Volume=/run/user/1000/pipewire-0:/mnt/host/pipewire-0:idmap
Volume=/run/user/1000/pulse:/mnt/host/pulse:idmap

Environment=WAYLAND_DISPLAY=wayland-1
Environment=XDG_RUNTIME_DIR=/run/user/1000
Environment=XDG_SESSION_TYPE=wayland
Environment=DISPLAY=:0
Environment=PULSE_SERVER=unix:/run/user/1000/pulse/native
