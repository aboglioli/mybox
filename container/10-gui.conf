# gui — the box as a client of your desktop: its apps draw on the host
# compositor and play through the host's pipewire.
#
# Started BY the session: graphical-session.target is reached once the
# compositor is up and its sockets exist, and PartOf= stops the box when
# the session ends. A compositor restart stops and re-reaches the target,
# so the box comes back on the new sockets instead of holding dead ones.
#
# Works only when the box runs under the desktop account itself — the
# sockets are that account's, and keep-id makes the box user the same uid.
#
# Sockets bind under /mnt/host, NOT /run/user/<uid>: the container's
# logind re-mounts /run/user/<uid> as a fresh tmpfs at session start,
# shadowing anything bound there. mybox-host-sockets.service (user
# scope) symlinks /mnt/host/* into $XDG_RUNTIME_DIR after logind.
#
# Only these three sockets. The rest of the runtime dir — the session
# bus, the gpg and ssh agents, podman.sock — would each let box code act
# as you outside the box. The session bus would also shadow the box's
# own D-Bus and break nested rootless podman.
#
# Wayland socket name varies by compositor (niri/sway → wayland-1,
# GNOME/KDE → wayland-0) — edit Volume= + WAYLAND_DISPLAY to match.
#
# No X11 socket bind — the host keeps :0 only as an abstract socket
# (netns-scoped, unreachable). For X11 apps run Xwayland INSIDE
# (xorg-xwayland + xwayland-satellite → mybox-xwayland.service).
#
# Audio goes through the PULSE socket. If `pipewire` is installed
# inside, mask its user socket/service — an empty local pipewire-0
# would shadow the host link.

[Unit]
After=graphical-session.target
PartOf=graphical-session.target

[Container]
Volume=%t/wayland-1:/mnt/host/wayland-1
Volume=%t/pipewire-0:/mnt/host/pipewire-0
Volume=%t/pulse:/mnt/host/pulse

# Set in the container env as well as /etc/environment.d/gui.conf: only
# fish sessions and the systemd user manager read environment.d, so a
# plain `podman exec … bash` would otherwise see none of it.
Environment=WAYLAND_DISPLAY=wayland-1
Environment=XDG_SESSION_TYPE=wayland
Environment=DISPLAY=:0

[Install]
WantedBy=graphical-session.target
