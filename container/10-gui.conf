# gui — host wayland / pipewire / pulse sockets.
#
# The one drop-in that is NOT shared between the instances: it installs
# into <name>@gui.container.d/, so it is the whole difference between
# <name>@headless.service and <name>@gui.service. Its bind sources are
# session sockets that do not exist until a compositor runs, and podman
# hard-fails a start on a missing bind source — which is exactly why the
# box boot-starts as @headless and only swaps here once a session is up.
#
# Sockets bind under /mnt/host, NOT /run/user/<uid>: the container's
# logind re-mounts /run/user/<uid> as a fresh tmpfs at session start,
# shadowing anything bound there. mybox-host-sockets.service (user
# scope) symlinks /mnt/host/* into $XDG_RUNTIME_DIR after logind.
#
# NEVER bind the host session bus: it would shadow the container's own
# user D-Bus and break nested rootless podman (crun's systemd cgroup
# manager).
#
# Wayland socket name varies by compositor (niri/sway → wayland-1,
# GNOME/KDE → wayland-0) — edit Volume= + WAYLAND_DISPLAY to match.
#
# The /run/user/1000 below is the HOST user's runtime dir — edit it to
# your own `id -u` if it is not 1000. Nothing on the CONTAINER side is
# hardcoded: the sockets land at /mnt/host and mybox-host-sockets.service
# links them into whatever $XDG_RUNTIME_DIR the session has, so
# MYBOX_UID stays free.
#
# No X11 socket bind — the host keeps :0 only as an abstract socket
# (netns-scoped, unreachable). For X11 apps run Xwayland INSIDE
# (xorg-xwayland + xwayland-satellite → mybox-xwayland.service).
#
# Audio goes through the PULSE socket. If `pipewire` is installed
# inside, mask its user socket/service — an empty local pipewire-0
# would shadow the host link.

# Ends the GUI instance when the session does. Logging out unmounts
# /run/user/<uid>, BindsTo= stops this instance with it, and the
# OnSuccess= in mybox@gui.container hands the box back to @headless —
# which also re-arms <name>-gui.path for the next login.
#
# Explicit because quadlet's own RequiresMountsFor= is not enough: systemd
# gives a mount it only discovered in /proc/self/mountinfo an After= but
# no Requires= (check with `systemctl show run-user-1000.mount -p
# RequiredBy`), so nothing would stop this instance at logout and the next
# session would inherit dead sockets.
#
# Same uid caveat as the Volume= lines below — edit 1000 to your own.
[Unit]
BindsTo=run-user-1000.mount
After=run-user-1000.mount

[Container]
Volume=/run/user/1000/wayland-1:/mnt/host/wayland-1:idmap
Volume=/run/user/1000/pipewire-0:/mnt/host/pipewire-0:idmap
Volume=/run/user/1000/pulse:/mnt/host/pulse:idmap

# Set in the container env as well as /etc/environment.d/gui.conf: only
# fish sessions and the systemd user manager read environment.d, so a
# plain `podman exec … bash` would otherwise see none of it.
#
# XDG_RUNTIME_DIR and PULSE_SERVER are deliberately absent — both would
# have to name a uid, and both are derived correctly per session
# instead (pam_systemd or /etc/profile.d/xdg.sh, then libpulse's own
# $XDG_RUNTIME_DIR/pulse/native default).
Environment=WAYLAND_DISPLAY=wayland-1
Environment=XDG_SESSION_TYPE=wayland
Environment=DISPLAY=:0
