# gpu — Intel/AMD GPU stack. NVIDIA users compose this with
# 30-nvidia.conf; both can coexist (hybrid graphics).
#
# /dev/dri/renderD128 — rendering (0666)
# /dev/dri/card0      — KMS/DRM master (0660 root:video; only matters
#                       for a compositor inside — see 50-desktop.conf)
# /dev/snd            — ALSA
# /dev/input          — keyboards, mice, gamepads

[Container]
AddDevice=/dev/dri
AddDevice=/dev/snd
AddDevice=/dev/input
