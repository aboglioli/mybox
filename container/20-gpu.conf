# gpu — render nodes, sound and input devices. NVIDIA users compose this
# with 30-nvidia.conf; both can coexist (hybrid graphics).
#
# Rootless podman has no device cgroup, so the host's own permissions
# decide what opens: render nodes are 0666; sound and game controllers
# open through the ACLs logind's uaccess grants the seat's user — which
# keep-id makes the box user. Keyboards and mice get no such ACL, so a
# box cannot read what is typed on the host.
#
# /dev/input and /dev/snd are bound as DIRECTORIES, so a controller or
# headset plugged in after the box started shows up inside.
# hidraw nodes sit directly in /dev and cannot be bound that way: Steam
# Input falls back to the evdev nodes for them.

[Container]
AddDevice=/dev/dri
Volume=/dev/snd:/dev/snd
Volume=/dev/input:/dev/input
