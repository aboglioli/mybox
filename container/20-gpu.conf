# mybox drop-in: gpu — Intel/AMD GPU stack.
#
# Parallel to incus `gpu` profile + mybox.nspawn's `Bind=/dev/dri`
# + `Bind=/dev/snd` lines. NVIDIA users compose this with 30-nvidia.conf
# below — both can coexist (DRI is hybrid-graphics-friendly).
#
# /dev/dri/renderD128 — Vulkan/OpenGL/VAAPI rendering (perms 0666)
# /dev/dri/card0      — KMS / DRM master (perms 0660 root:video,
#                       only usable by container root; override at the
#                       host with a udev rule or use compositor-inside
#                       drop-in 50-desktop.conf which adds /dev/tty*)
# /dev/snd            — ALSA audio
# /dev/input          — keyboards, mice, gamepads (Steam Input,
#                       Sunshine streaming)

[Container]
AddDevice=/dev/dri
AddDevice=/dev/snd
AddDevice=/dev/input
