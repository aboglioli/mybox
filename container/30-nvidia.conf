# mybox drop-in: nvidia — NVIDIA GPU via CDI.
#
# Parallel to incus `nvidia` profile. UNLIKE incus's libnvidia-container
# LXC-hook path (which is broken for Vulkan/EGL JSON injection on
# 580+/595+ drivers — see incus.yaml comment block), podman reads
# CDI specs directly. Vulkan, EGL, CUDA all work without
# `mybox install-nvidia` workarounds.
#
# Host prereq (one time + after every host driver upgrade):
#
#   sudo dnf install nvidia-container-toolkit         # Fedora
#   sudo pacman -S nvidia-container-toolkit           # Arch
#   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
#   sudo systemctl enable --now nvidia-cdi-refresh.service   # if shipped
#
# Verify the CDI spec:
#   nvidia-ctk cdi list
#   # → nvidia.com/gpu=0, nvidia.com/gpu=<UUID>, nvidia.com/gpu=all
#
# nvidia.com/gpu=all       all GPUs visible
# nvidia.com/gpu=0         first GPU only
# nvidia.com/gpu=<UUID>    specific GPU (multi-GPU hosts)
#
# Change `all` below to a specific selector if you want one GPU.

[Container]
AddDevice=nvidia.com/gpu=all

# Environment for nvidia tooling that reads these (mostly noop with
# CDI but harmless).
Environment=NVIDIA_DRIVER_CAPABILITIES=all
Environment=NVIDIA_VISIBLE_DEVICES=all
