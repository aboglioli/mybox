# nvidia — NVIDIA GPU via CDI. Podman injects the device nodes AND the
# host driver's own userland (libGLX_nvidia, libcuda, Vulkan/EGL ICDs,
# nvidia-smi), so it always matches the host kernel module and nothing
# is installed inside. Works rootless.
#
# Host prereq: a CDI spec (`nvidia-ctk cdi list` → nvidia.com/gpu=all).
# On myosi the nvidia sysexts generate it at boot; elsewhere:
#   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
# and again after every driver upgrade.
#
# 64-bit only: the CDI spec carries no 32-bit libraries. Flatpak apps
# (Steam among them) get both halves from Flathub's GL.nvidia and
# GL32.nvidia extensions, matched to the host driver.
#
# No NVIDIA_* environment: CDI does not read it, and it is exactly what
# wakes the legacy nvidia-container-runtime-hook if a host still
# registers one — which then fails the start under a user namespace.
#
# Change `all` to `0` or a UUID to pin one GPU on multi-GPU hosts.

[Container]
AddDevice=nvidia.com/gpu=all
