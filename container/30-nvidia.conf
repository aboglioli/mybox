# nvidia — NVIDIA GPU via CDI. Podman reads CDI specs natively, so
# Vulkan/EGL/CUDA work without installing userland inside.
#
# Host prereq (one time + after every driver upgrade):
#   sudo pacman -S nvidia-container-toolkit    # or dnf install
#   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
#
# Verify: `nvidia-ctk cdi list` → nvidia.com/gpu=all / =0 / =<UUID>.
# Change `all` below to pin one GPU on multi-GPU hosts.

[Container]
AddDevice=nvidia.com/gpu=all

# Mostly no-op with CDI but harmless; some tooling reads them.
Environment=NVIDIA_DRIVER_CAPABILITIES=all
Environment=NVIDIA_VISIBLE_DEVICES=all
