# nvidia-raw — raw /dev/nvidia* passthrough. Alternative to
# 30-nvidia.conf (CDI) for host/driver combos where the CDI hook fails
# under userns. Needs matching userland inside:
#   sudo mybox install-nvidia    # matches host driver via .run installer
#
# The /dev/nvidia* nodes are NOT all there at boot. Only `nvidia` itself
# is autoloaded, by udev matching the GPU's modalias; nvidia_uvm follows a
# softdep, but nvidia_modeset and nvidia_drm match no device, so the kernel
# defers them to the first DRM client — the compositor. The [Service]
# section below creates what is missing before podman looks, so this drop-in
# needs nothing from the host.

[Container]
AddDevice=/dev/nvidia0
AddDevice=/dev/nvidiactl
AddDevice=/dev/nvidia-uvm
AddDevice=/dev/nvidia-uvm-tools

# REQUIRED for Vulkan, not just KMS: without it the driver segfaults
# inside vkCreateDevice — nvidia-smi and GPU enumeration still look
# fine, then SIGSEGV.
#
# NOT `AddDevice=-`. The leading dash means "skip if absent", but quadlet
# resolves it in the GENERATOR, at boot — and nvidia_modeset does not load
# until a compositor starts, hours later. So the optional form is dropped
# on every single boot and never comes back, even once the node exists:
# the command line was already baked. The result is the worst kind of
# failure, a container that starts fine and segfaults in GPU apps at
# runtime. Non-optional is evaluated by podman at START instead, and the
# ExecStartPre below guarantees the node is there by then.
AddDevice=/dev/nvidia-modeset

Environment=NVIDIA_DRIVER_CAPABILITIES=all
Environment=NVIDIA_VISIBLE_DEVICES=all

[Service]
# Make the deferred nodes exist before podman evaluates AddDevice=.
# nvidia-modprobe is NVIDIA's own setuid helper and does both halves
# synchronously — load the module, create the node — which plain modprobe
# does not: there the node arrives later, via udev, and podman can lose
# that race. modprobe is the fallback for hosts that lack the helper.
#
# `-` on both: a host with no NVIDIA at all has no business installing this
# drop-in, and if it does, the honest error is podman's "no such file or
# directory" naming the device — not a unit that died in ExecStartPre.
ExecStartPre=-/usr/bin/nvidia-modprobe -m -u
ExecStartPre=-/usr/bin/modprobe nvidia_modeset
