# mybox drop-in: nvidia-raw — raw /dev/nvidia* device passthrough.
#
# Alternative to 30-nvidia.conf (CDI mode). Use this when:
#   * CDI hook (nvidia-cdi-hook) fails inside the container — happens
#     on some host/driver combos where userns shift breaks the hook's
#     symlink-creation step.
#   * You want to follow the same pattern as mybox.nspawn (raw device
#     binds, no CDI), and install the matching userland inside via
#     `mybox install-nvidia`.
#
# /dev/nvidia-uvm only exists after `modprobe nvidia_uvm` runs on
# the host. Preload at host boot (one-time):
#   echo -e 'nvidia\nnvidia_uvm\nnvidia_modeset\nnvidia_drm' \
#       | sudo tee /etc/modules-load.d/nvidia.conf
#
# After this drop-in, inside the container run:
#   sudo mybox install-nvidia   # matches host driver via .run installer

[Container]
# Always-present devices (CUDA, Vulkan compute, NVENC).
AddDevice=/dev/nvidia0
AddDevice=/dev/nvidiactl
AddDevice=/dev/nvidia-uvm
AddDevice=/dev/nvidia-uvm-tools

# /dev/nvidia-modeset is REQUIRED for Vulkan, not just for KMS. Without
# it the NVIDIA driver segfaults inside vkCreateDevice — enumeration and
# device properties succeed, so `nvidia-smi` and vkcube's "Selected GPU 0"
# line both look fine, then it dies with SIGSEGV. It does not fail
# gracefully.
#
# Leading `-` = optional: quadlet passes the device when it exists and
# silently drops it when it does not, so headless hosts without the
# nvidia_modeset module still start. (Verified with `quadlet -dryrun`.)
# This list now matches the host CDI spec exactly.
AddDevice=-/dev/nvidia-modeset

Environment=NVIDIA_DRIVER_CAPABILITIES=all
Environment=NVIDIA_VISIBLE_DEVICES=all
