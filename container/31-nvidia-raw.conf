# nvidia-raw — raw /dev/nvidia* passthrough. Alternative to
# 30-nvidia.conf (CDI) for host/driver combos where the CDI hook fails
# under userns. Needs matching userland inside:
#   sudo mybox install-nvidia    # matches host driver via .run installer
#
# /dev/nvidia-uvm only exists after `modprobe nvidia_uvm` on the host.
# Preload at host boot:
#   printf 'nvidia\nnvidia_uvm\nnvidia_modeset\nnvidia_drm\n' \
#       | sudo tee /etc/modules-load.d/nvidia.conf

[Container]
AddDevice=/dev/nvidia0
AddDevice=/dev/nvidiactl
AddDevice=/dev/nvidia-uvm
AddDevice=/dev/nvidia-uvm-tools

# REQUIRED for Vulkan, not just KMS: without it the driver segfaults
# inside vkCreateDevice — nvidia-smi and GPU enumeration still look
# fine, then SIGSEGV. Leading `-` = quadlet skips it when absent
# (headless hosts without nvidia_modeset still start).
AddDevice=-/dev/nvidia-modeset

Environment=NVIDIA_DRIVER_CAPABILITIES=all
Environment=NVIDIA_VISIBLE_DEVICES=all
