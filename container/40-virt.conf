# mybox drop-in: virt — KVM + libvirt + QEMU inside the container.
#
# Parallel to incus `virt` profile + mybox.nspawn's commented
# /dev/kvm + /dev/net/tun + /dev/vhost-* binds.
#
# Inside the container, after this drop-in:
#   sudo pacman -S libvirt qemu-base qemu-system-x86 virt-manager \
#       edk2-ovmf swtpm dnsmasq dmidecode iptables-nft bridge-utils
#   sudo usermod -aG libvirt,kvm user
#   sudo systemctl enable --now libvirtd
#
# vhost-net / vhost-vsock are perf knobs — virtio-net falls back to
# userspace copy without them, VMs still work, just slower.

[Container]
AddDevice=/dev/kvm
AddDevice=/dev/net/tun
AddDevice=/dev/vhost-net
AddDevice=/dev/vhost-vsock

AddCapability=NET_ADMIN NET_RAW
