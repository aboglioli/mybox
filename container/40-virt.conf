# virt — KVM + libvirt + QEMU inside the container.
#
# Inside, after this drop-in:
#   sudo pacman -S libvirt qemu-base qemu-system-x86 virt-manager \
#       edk2-ovmf swtpm dnsmasq dmidecode iptables-nft bridge-utils
#   sudo systemctl enable --now virtqemud.socket virtnetworkd.socket \
#       virtstoraged.socket virtnodedevd.socket
#
# Plain `systemctl enable` — nothing mybox-specific. The one caveat is
# the /usr overlay: a package installed at RUNTIME puts its unit files
# in the overlay upperdir, which PID 1 cannot read yet when it builds
# the boot transaction, so the enable symlink dangles for that one
# unit until you start it again. Bake libvirt into a variant image
# (FROM ghcr.io/aboglioli/mybox) and the unit ships in the image's
# /usr, visible from the first instant of boot — enable then behaves
# exactly like on any other machine. Runtime install for trying it out,
# variant image for keeping it.
#
# libvirt/kvm membership needs no usermod: both are in
# mybox-user-setup's base group set, re-bound every boot.
#
# vhost-net / vhost-vsock are perf knobs — VMs work without them.

[Container]
AddDevice=/dev/kvm
AddDevice=/dev/net/tun
AddDevice=/dev/vhost-net
AddDevice=/dev/vhost-vsock

AddCapability=NET_ADMIN NET_RAW
