# vfio — PCI passthrough TO a guest VM inside. Stack on 40-virt.conf.
#
# Host prereq (kernel cmdline):
#   intel_iommu=on iommu=pt            # or amd_iommu=on
#   vfio-pci.ids=10de:1b81,10de:10f0   # device vendor:id pairs
#
# Find the device's IOMMU group and replace `1` below:
#   readlink /sys/bus/pci/devices/0000:01:00.0/iommu_group
# If the GPU's audio function sits in another group, add its
# AddDevice=/dev/vfio/<N> too.
#
# memlock=-1 is MANDATORY — VFIO pins VM RAM; the default ulimit is
# far too small.

[Container]
AddDevice=/dev/vfio/vfio
AddDevice=/dev/vfio/1

AddCapability=SYS_RAWIO IPC_LOCK MKNOD
Ulimit=memlock=-1:-1
