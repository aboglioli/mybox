# mybox drop-in: vfio — PCI passthrough TO a guest VM running inside.
#
# Stack on top of 40-virt.conf when you want to give the inner libvirt
# VM a host PCI device (most commonly: a GPU for win11-gaming-style
# passthrough, or an HBA / NIC).
#
# Host prereq (one-time, in kernel cmdline):
#   intel_iommu=on iommu=pt           # Intel
#   amd_iommu=on iommu=pt              # AMD
#   vfio-pci.ids=10de:1b81,10de:10f0   # GPU vendor:device + HDMI audio
#
# Confirm vfio-pci binding:
#   lspci -nnk -d 10de:1b81 | grep "Kernel driver"
#   # Kernel driver in use: vfio-pci
#
# Find your GPU's IOMMU group:
#   readlink /sys/bus/pci/devices/0000:01:00.0/iommu_group
#   # → ../../../../../kernel/iommu_groups/1   ← group number = 1
#
# Replace `1` below with your actual IOMMU group. If your GPU's audio
# function is in a different group, add another AddDevice=/dev/vfio/<N>.
#
# Inside the container, after this drop-in (libvirt from 40-virt.conf):
#   virt-install --hostdev pci_0000_01_00_0 ...
#
# memlock=-1 is MANDATORY — VFIO_IOMMU_MAP_DMA pins VM RAM and the
# default 64KB ulimit is far too small.

[Container]
AddDevice=/dev/vfio/vfio
AddDevice=/dev/vfio/1

AddCapability=SYS_RAWIO IPC_LOCK MKNOD
Ulimit=memlock=-1:-1
