# mybox drop-in: desktop — run a Wayland compositor INSIDE the
# container (niri / sway / hyprland owning the physical display).
#
# Rare; typical pattern is to use the 10-gui.conf drop-in to render
# as a wayland CLIENT of the host compositor. This drop-in is for
# the inverse: container owns DRM master, host runs text-mode.
#
# Parallel to incus `desktop` profile + mybox.nspawn's commented
# /dev/tty[0-4] + /dev/input + /dev/uinput binds.
#
# Host prereq (one-time):
#   sudo systemctl set-default multi-user.target
#   sudo systemctl disable gdm sddm lightdm 2>/dev/null || true
#   reboot
#
# Compose with 20-gpu.conf (gives /dev/dri); this drop-in adds the
# TTY + input nodes the compositor needs.
#
# Inside the container:
#   sudo pacman -S niri seatd polkit pipewire pipewire-pulse \
#       wireplumber xdg-desktop-portal-{gtk,gnome} qt6-wayland \
#       xorg-xwayland foot fuzzel wl-clipboard mako
#   sudo systemctl enable --now seatd
#   sudo usermod -aG seat,video,input,render user
#
# Workflow at host text TTY, logged in as user:
#   ssh -p 2222 user@localhost          # PAM session via sshd
#   niri-session                            # grabs DRM master

[Container]
AddDevice=/dev/dri
AddDevice=/dev/input
AddDevice=/dev/uinput
AddDevice=/dev/tty0
AddDevice=/dev/tty1
AddDevice=/dev/tty2
AddDevice=/dev/tty3
AddDevice=/dev/tty4

AddCapability=NET_ADMIN SYS_TTY_CONFIG

Environment=WLR_LIBSEAT_NO_LOGIND=1
