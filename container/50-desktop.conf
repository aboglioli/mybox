# desktop — run a Wayland compositor INSIDE (container owns DRM
# master, host runs text-mode). Rare; the usual pattern is 10-gui.conf
# (client of the host compositor). Compose with 20-gpu.conf.
#
# Host prereq:
#   sudo systemctl set-default multi-user.target
#   sudo systemctl disable gdm sddm lightdm 2>/dev/null || true
#   reboot
#
# Inside:
#   sudo pacman -S niri seatd polkit pipewire pipewire-pulse \
#       wireplumber xdg-desktop-portal-{gtk,gnome} qt6-wayland \
#       xorg-xwayland foot fuzzel wl-clipboard mako
#   sudo systemctl enable --now seatd
#   systemctl --user enable --now pipewire pipewire-pulse wireplumber
#   echo seat | sudo tee /usr/share/mybox/user-groups.d/50-desktop.conf
#
# The audio stack is enabled by hand HERE and nowhere in the image,
# because this drop-in is the rare case: with 10-gui.conf (the usual
# setup) the container is a CLIENT of the host's pipewire — the host
# sockets are bind-mounted in, a nested pipewire would shadow them, and
# an image that pre-enabled it would break the common path to serve the
# rare one. Only a compositor-inside container owns its own audio.
#
# The user-groups.d line adds `seat` — the one group mybox-user-setup
# does not already bind — on the next boot.
#
# Then from a host text TTY: ssh -p 2222 <user>@<ip> && niri-session

[Container]
AddDevice=/dev/dri
AddDevice=/dev/input
AddDevice=/dev/uinput
AddDevice=/dev/tty0
AddDevice=/dev/tty1
AddDevice=/dev/tty2
AddDevice=/dev/tty3
AddDevice=/dev/tty4

AddCapability=NET_ADMIN SYS_TTY_CONFIG

Environment=WLR_LIBSEAT_NO_LOGIND=1
