# vpn — WireGuard or Tailscale inside the container. VPN routes apply
# only to traffic originating inside (own netns); nested podman
# containers ride the same netns and follow the VPN.
#
# Capabilities only: /dev/net/tun already comes from the base, and the
# base deliberately ships without NET_ADMIN/NET_RAW — quadlet appends
# them here only when the feature is enabled.
#
# WireGuard: pacman -S wireguard-tools; config at /etc/wireguard/wg0.conf;
#   systemctl enable --now wg-quick@wg0
# Tailscale: pacman -S tailscale; systemctl enable --now tailscaled;
#   tailscale up
#
# Persistence rides the mandatory /etc bind (/etc/wireguard on the /etc
# bind, /var/lib/tailscale on /var). Without it add your own Volume=.

[Container]
# Already in the base; restated so the drop-in documents its own
# requirement rather than inheriting it silently.
AddCapability=NET_ADMIN NET_RAW
