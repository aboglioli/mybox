# mybox drop-in: vpn — run a VPN client inside the container.
#
# Covers WireGuard and Tailscale; they needed identical plumbing, so this
# replaces the old 70-wireguard.conf + 71-tailscale.conf.
#
# The container has its own network namespace (unless Network=host), so
# VPN routes apply ONLY to traffic originating inside — the host's
# networking is untouched. Nested rootless podman containers ride the
# same namespace, so they follow the VPN too.
#
# Capabilities only. /dev/net/tun already comes from the base
# mybox.container (nested rootless podman needs it), so this drop-in adds
# just the two capabilities the VPN daemons need to create and configure
# their interface. Quadlet APPENDS AddCapability= to the base list, and
# the base deliberately ships without NET_ADMIN/NET_RAW — they arrive
# here, and in 40-virt.conf, only when the feature is enabled.
#
# WireGuard, inside the container:
#   pacman -S wireguard-tools
#   # drop your config at /etc/wireguard/wg0.conf
#   systemctl enable --now wg-quick@wg0
#
# Tailscale, inside the container:
#   pacman -S tailscale
#   systemctl enable --now tailscaled
#   tailscale up            # interactive auth, or --authkey=tskey-…
# The container joins your tailnet as its own node, independent of the
# host.
#
# Persistence comes free from 01-persist-root.conf: /etc/wireguard (keys,
# peers) rides the /etc bind and /var/lib/tailscale (node identity, ACLs,
# magicdns) rides the /var bind — both under /srv/<name> on the host.
# Without that drop-in, add your own Volume= for whichever you use.

[Container]
AddCapability=NET_ADMIN NET_RAW
