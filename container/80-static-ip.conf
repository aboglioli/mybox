# mybox drop-in: static-ip — pin the macvlan container to a fixed
# LAN IP instead of DHCP.
#
# Apply on top of the quadlet + its .network file. Edit
# the IP below to one that's outside your DHCP server's lease range
# (e.g., reserve 192.168.100.50-99 for static container assignments).

[Container]
IP=192.168.100.50
