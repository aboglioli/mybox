# static-ip — pin a fixed address instead of DHCP.
#
# Only meaningful on a network with static IPAM, and the network must
# declare the subnet the address belongs to — neither shipped .network
# file does by default:
#
#   mybox-nat.network   uncomment Subnet=/Gateway= (see the file)
#   mybox-lan.network   drop IPAMDriver=dhcp and declare your LAN's
#                       Subnet=/Gateway=, then pick an address outside
#                       the router's DHCP pool or you will fight a lease
#
# Run `just net-reset` after changing the network file: an existing
# podman network is never reconciled against it.

[Container]
IP=192.168.0.50
