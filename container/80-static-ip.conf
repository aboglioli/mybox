# static-ip — pin a fixed address instead of DHCP.
#
# Only meaningful on a network with static IPAM: comment out
# IPAMDriver=dhcp in mybox-lan.network and declare its Subnet=/Gateway=
# first, or use it on mybox-nat.network to pin the podman-side address.
# The address must sit inside that network's subnet, and on a LAN it must
# be outside the router's DHCP pool or you will collide with a lease.

[Container]
IP=192.168.0.50
