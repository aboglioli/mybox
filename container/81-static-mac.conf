# mybox drop-in: static-mac — pin the container MAC address.
#
# Quadlet recreates the container on every start and podman
# re-randomizes the MAC each time, so a DHCP network (bridge or
# macvlan) hands out a NEW lease → the LAN IP drifts across restarts.
# Pinning a locally-administered MAC (02: prefix) keeps the same DHCP
# lease → same LAN IP forever.
#
# Edit the address per box (make it unique on your LAN). The justfile
# path derives one from the container name automatically; quadlet has
# no native key nor hashing, so it's pinned literally here.
#
# Not for Network=host (no dedicated interface).

[Container]
PodmanArgs=--mac-address=02:4d:59:42:4f:58
