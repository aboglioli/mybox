# static-mac — pin the container MAC. Podman re-randomizes the MAC on
# every recreation, so DHCP hands out a new lease and the LAN IP
# drifts; a pinned locally-administered MAC (02: prefix) keeps the
# lease. Make it unique per box. Not for Network=host.

[Container]
PodmanArgs=--mac-address=02:4d:59:42:4f:58
