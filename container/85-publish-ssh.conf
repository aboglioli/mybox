# publish-ssh — expose the container's sshd on the host's port 2222.
#
# For mybox-nat.network only. A NAT'd container has no LAN address, so
# the only way in from another machine is a published port:
#
#   ssh -p 2222 <user>@<host-ip>
#
# REMOVE this drop-in when using mybox-br0.network or mybox-lan.network:
# there the container has its own LAN IP and answers on 2222 directly,
# and publishing ports on a network podman does not NAT is meaningless.

[Container]
PublishPort=2222:2222
