# OPT-IN feature drop-in — cgroup DeviceAllow= rules for NVIDIA GPU.
#
# Machine-agnostic. Same source file works for mybox, myosi, or any
# future nspawn machine.
#
# Pair with `Bind=/dev/nvidia*` directives inlined in the target
# machine's `<machine>.nspawn` — `Bind=` makes the nodes appear,
# `DeviceAllow=` permits ioctls on them. The pair is split because
# nspawn does not honor `.nspawn.d/*.conf` drop-ins
# (`src/nspawn/nspawn-settings.c:85` uses `config_parse()` single-
# file), while `*.service.d/*.conf` IS standard systemd unit
# drop-in machinery and works.
#
# Install (replace <MACHINE> with your machine name):
#   M=<MACHINE>
#   sudo install -D -m 0644 40-gpu-nvidia.service.conf \
#       /etc/systemd/system/systemd-nspawn@$M.service.d/40-gpu-nvidia.conf
#   sudo systemctl daemon-reload
#
# Without these rules, the device nodes exist inside the container
# but nvidia-smi reports:
#       Failed to initialize NVML: GPU access blocked by the operating system

[Service]
DeviceAllow=/dev/nvidia0 rwm
DeviceAllow=/dev/nvidiactl rwm
DeviceAllow=/dev/nvidia-modeset rwm
DeviceAllow=/dev/nvidia-uvm rwm
DeviceAllow=/dev/nvidia-uvm-tools rwm
# char-drm covers /dev/dri/card* + /dev/dri/renderD* (DRM major 226)
# — required for Mesa / Vulkan rendering even without NVIDIA. Base
# machine service units don't ship this rule; if no GPU feature is
# enabled at all, char-drm rwm stays denied (software-only render).
DeviceAllow=char-drm rwm
