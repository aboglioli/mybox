# OPT-IN feature drop-in — cgroup device permissions for input
# devices and synthetic input. Required for any container that runs
# a full graphical session (niri/sway/gnome/etc.) or that uses
# Sunshine / Steam Input for synthetic input events.
#
# Machine-agnostic. Works for nirisession, gamingrig, or any future
# nspawn machine that needs raw input access.
#
# Pair with these bind directives inlined in the target machine's
# <machine>.nspawn:
#
#   Bind=/dev/input        # keyboards, mice, touchpads, gamepads
#   Bind=/dev/uinput       # synthetic input device
#   Bind=/dev/tty0         # active VT marker (logind reads it)
#   Bind=/dev/tty1         # ...and a few real VTs for niri to grab
#   Bind=/dev/tty2
#   Bind=/dev/tty3
#   Bind=/dev/tty4
#
# nspawn does not honor .nspawn.d/*.conf drop-ins
# (src/nspawn/nspawn-settings.c:85 uses single-file config_parse()),
# so the Bind= directives must be inline; this *.service.conf is a
# standard systemd unit drop-in and DOES work.
#
# Install (replace <MACHINE> with your machine name):
#   M=<MACHINE>
#   sudo install -D -m 0644 50-input.service.conf \
#       /etc/systemd/system/systemd-nspawn@$M.service.d/50-input.conf
#   sudo systemctl daemon-reload
#
# Without these rules the device nodes exist inside the container
# but every open() returns EPERM (kernel-enforced cgroup device
# controller denial).

[Service]
# All character input devices (keyboards, mice, touchpads, gamepads).
# `char-input` is the cgroup shorthand for major number 13 (input
# subsystem).
DeviceAllow=char-input rwm

# Synthetic input device for sunshine/Steam Input/uinput-based tools.
DeviceAllow=/dev/uinput rw

# Virtual terminal framebuffer + active-VT marker. niri needs to
# read these to grab a seat.
DeviceAllow=/dev/tty0 rw
DeviceAllow=/dev/tty1 rw
DeviceAllow=/dev/tty2 rw
DeviceAllow=/dev/tty3 rw
DeviceAllow=/dev/tty4 rw

# `char-vcs` covers /dev/vcs* and /dev/vcsa* — VT console buffers.
# Needed for some session-manager handover scenarios.
DeviceAllow=char-vcs rwm
