# OPT-IN feature drop-in — cgroup device permissions for KVM /
# libvirt / QEMU. Install for any container that needs to run VMs
# inside (virt-manager, qemu, libvirtd).
#
# /dev/net/tun is NOT in this drop-in. VPN + virt + nested-podman
# all share that one device; it lives in 70-tun.service.conf for
# parity with lxc/tun.conf. Install BOTH when running VMs that use
# tap-mode networking:
#
#   sudo install -D -m 0644 60-virt.service.conf \
#       /etc/systemd/system/systemd-nspawn@$M.service.d/60-virt.conf
#   sudo install -D -m 0644 70-tun.service.conf \
#       /etc/systemd/system/systemd-nspawn@$M.service.d/70-tun.conf
#   sudo systemctl daemon-reload
#
# Pair with these Bind directives inlined in the target machine's
# <machine>.nspawn:
#
#   Bind=/dev/kvm           # KVM hardware acceleration
#   Bind=/dev/net/tun       # TAP devices for VM networking (70-tun)
#   Bind=/dev/vhost-net     # virtio-net offload (optional)
#   Bind=/dev/vhost-vsock   # vsock between VMs and container (optional)
#
# nspawn does not honor .nspawn.d/*.conf drop-ins. This *.service.conf
# is the supported drop-in path (systemd-nspawn@<machine>.service.d/).
#
# In-container setup:
#   sudo pacman -S libvirt qemu-base qemu-system-x86 \
#       virt-manager edk2-ovmf swtpm dnsmasq dmidecode \
#       iptables-nft bridge-utils
#   sudo usermod -aG libvirt,kvm <user>
#   sudo systemctl enable --now libvirtd
#
# Without these rules /dev/kvm exists inside the container but every
# open() returns EPERM:
#   qemu-system-x86_64: Could not access KVM kernel module: Permission denied
#   qemu-system-x86_64: failed to initialize kvm: Permission denied

[Service]
# KVM accelerator (major 10, minor 232 — char-misc range).
DeviceAllow=/dev/kvm rw

# vhost-net: kernel-side virtio-net backend, avoids userspace data
# copy → ~2x perf for VM network throughput. Optional but standard.
DeviceAllow=/dev/vhost-net rw

# vhost-vsock: AF_VSOCK between host (here, the container) and its
# guest VMs. Optional, used by guest agents and some toolchains.
DeviceAllow=/dev/vhost-vsock rw
