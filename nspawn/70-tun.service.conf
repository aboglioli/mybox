# OPT-IN feature drop-in — cgroup device permission for /dev/net/tun.
#
# Parallel to lxc/tun.conf: factored out so VPN and VM features share
# the same source of truth. Nested rootless podman uses pasta (TAP
# via /dev/net/tun), WireGuard creates one tun per peer iface,
# Tailscale spawns one, OpenVPN spawns one, libvirt tap-mode VMs
# need it.
#
# nspawn does not honor .nspawn.d/*.conf drop-ins. This *.service.conf
# is the supported drop-in path (systemd-nspawn@<machine>.service.d/).
#
# Pair with this Bind in <machine>.nspawn:
#
#   Bind=/dev/net/tun
#
# (mybox.nspawn does NOT bind /dev/net/tun in the always-on Bind
# block — opt in by uncommenting the line in the VM-block at the
# bottom of mybox.nspawn AND installing this drop-in.)
#
# Install:
#   M=<MACHINE>
#   sudo install -D -m 0644 70-tun.service.conf \
#       /etc/systemd/system/systemd-nspawn@$M.service.d/70-tun.conf
#   sudo systemctl daemon-reload

[Service]
# TAP/TUN char device. Major 10, minor 200.
DeviceAllow=/dev/net/tun rw
