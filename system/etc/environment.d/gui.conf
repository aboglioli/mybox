# GUI environment (systemd-environment-d-generator drop-in) — loaded by
# the user manager at session start. Override per-host via
# /etc/environment.d/99-host.conf.
#
# Wayland socket name varies by host compositor (niri/sway → wayland-1,
# GNOME/KDE → wayland-0). Paths are relative to XDG_RUNTIME_DIR — the
# standard discovery locations, so flatpak and native libs find them
# with no per-app env; 10-gui.conf binds the host sockets and
# mybox-host-sockets.service links them into place.
#
# DISPLAY=:0 requires Xwayland running INSIDE (mybox-xwayland.service);
# the host's :0 is an abstract socket in another netns, unreachable.
#
# Audio goes through PULSE_SERVER (host pipewire-pulse). If `pipewire`
# is installed inside, mask its user socket/service — an empty local
# pipewire-0 shadows the host link and yields silence.

WAYLAND_DISPLAY=wayland-1
XDG_SESSION_TYPE=wayland
XDG_RUNTIME_DIR=/run/user/1000
DISPLAY=:0
PULSE_SERVER=unix:/run/user/1000/pulse/native
