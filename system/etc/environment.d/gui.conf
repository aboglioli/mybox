# Mybox GUI environment — systemd-environment-d-generator(8) drop-in.
#
# Loaded by systemd user manager at session start; pulled into the
# user's environment before any user service / shell starts. KEY=VALUE
# format, one per line.
#
# Wayland socket name varies by host compositor:
#   niri / sway  → wayland-1
#   GNOME / KDE  → wayland-0
# Override per-host via a drop-in at /etc/environment.d/99-host.conf.
#
# Paths are relative to XDG_RUNTIME_DIR (/run/user/1000) — the standard
# discovery locations, so flatpak's `--socket=pulseaudio`/`=wayland` and
# native libs find them with no per-app env. How the sockets get there
# depends on the runtime:
#   * podman (rootful quadlet): bound directly at /run/user/1000/* — its
#     `podman exec` entry is not a logind login, so nothing shadows them.
#   * incus / nspawn: bound at /mnt/host/* (logind wipes /run/user at the
#     login used to enter these), then mybox-host-sockets.service (user)
#     symlinks /mnt/host/* → /run/user/1000/* at session start. Those
#     runtimes may ALSO export absolute /mnt/host paths — same socket.
#
# DISPLAY=:0 requires Xwayland running INSIDE (mybox-xwayland.service);
# the host's :0 is an abstract socket in another netns and unreachable.
#
# Audio: PULSE_SERVER (pipewire-pulse on the host serves the Pulse
# protocol; Firefox & most apps speak Pulse, not native pipewire, for
# sound). If `pipewire` is installed for a client-of-host container, mask
# its user pipewire.socket/pipewire.service — else it creates an empty
# /run/user/1000/pipewire-0 that shadows the host link and yields silence.

WAYLAND_DISPLAY=wayland-1
XDG_SESSION_TYPE=wayland
XDG_RUNTIME_DIR=/run/user/1000
DISPLAY=:0
PULSE_SERVER=unix:/run/user/1000/pulse/native
