# Mybox nsswitch — use systemd-resolved for hostname lookups.
#
# The `resolve` module queries systemd-resolved directly via DBus,
# bypassing /etc/resolv.conf (which podman's --dns flag fills with
# netavark-supplied servers that may be unreachable from inside the
# container — e.g., a tailscale-equipped host's stub resolver IP).
#
# With this nsswitch + our resolved.conf.d/50-mybox.conf override,
# DNS goes: app → NSS resolve → systemd-resolved → 8.8.8.8 /
# 1.1.1.1. Container's /etc/resolv.conf becomes irrelevant.
#
# Falls back to plain `dns` (libresolv → /etc/resolv.conf) if
# resolved is unavailable.

passwd:     files systemd
group:      files [SUCCESS=merge] systemd
shadow:     files systemd
gshadow:    files systemd

hosts:      mymachines resolve [!UNAVAIL=return] files myhostname dns
networks:   files

protocols:  files
services:   files
ethers:     files
rpc:        files

netgroup:   files
