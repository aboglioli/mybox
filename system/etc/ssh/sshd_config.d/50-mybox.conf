# Mybox sshd drop-in. Mirrors myosi's host-side hardening with
# container-specific adjustments.
#
# Port 2222 — when the container shares the host's netns
# (Network=host) port 22 belongs to the host sshd; with own LAN IP
# (bridge/macvlan) it's arbitrary, 2222 stays consistent across
# both modes.

Port 2222

# Auth — pubkey-only.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
UsePAM yes
AuthenticationMethods publickey
PubkeyAuthentication yes
PermitEmptyPasswords no

# Per-user authorized_keys + local /etc drop-in. Container doesn't
# ship myosi's fleet-keys sysext or systemd credentials, so those
# sources are dropped from myosi's list.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u

# Session limits
MaxAuthTries 3
MaxSessions 10
LoginGraceTime 60
ClientAliveInterval 300
ClientAliveCountMax 2

# Disable unused / insecure features
X11Forwarding no
PrintMotd no
PermitUserEnvironment no
PermitUserRC no
IgnoreRhosts yes
StrictModes yes
HostbasedAuthentication no

# Forwarding (agent + tcp ok, X11 off — flip to yes if you want
# `ssh -X` to forward to your local X server)
AllowAgentForwarding yes
AllowTcpForwarding yes

# Modern crypto only (post-2020) — same as myosi
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com,sk-ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256

# SFTP subsystem — Arch ships at /usr/lib/ssh/sftp-server.
Subsystem sftp /usr/lib/ssh/sftp-server
