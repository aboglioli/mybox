# Cap the journal, which is PERSISTENT on this layout.
#
# podman mounts a tmpfs over /var/log/journal (--systemd=always), but the
# pre-init overlays /var on top of it, so the path now resolves into the
# overlay and journald writes to the host bind - logs survive container
# recreation. Verify with `stat -f -c %T /var/log/journal` (overlayfs, not
# tmpfs); `findmnt` still reports the shadowed tmpfs from mountinfo and is
# misleading here.
#
# Unbounded, journald's default ceiling is 10% of the filesystem, which is
# the whole host pool. 500M is months of a daily driver's logs, and it also
# keeps the /var diff small enough to stay readable - the diff is how you
# see what a box changed.
#
# RuntimeMaxUse covers /run/log/journal for the case where the pre-init
# could not assemble /var and journald falls back to volatile storage.
#
# Note `journalctl -b -1` still shows nothing: a container reads the HOST's
# boot_id, so every boot carries the same id and journalctl groups them as
# one. The entries are all there, just not split per boot.

[Journal]
SystemMaxUse=500M
RuntimeMaxUse=500M
SystemMaxFileSize=50M
