# Cap the journal. /var is a host bind, so the journal is PERSISTENT
# (/var/log/journal exists in the factory tree) and grows across every
# container recreation — unlike /run, nothing wipes it. systemd's
# default ceiling is 10% of the filesystem, i.e. tens of GB on a normal
# disk, all of it inside /srv/<name>/var.
#
# 500M of a daily driver's journal is months of history. Raise it if
# you keep long investigations; it is operator state either way, so an
# edit here survives image rebases.

[Journal]
Storage=persistent
SystemMaxUse=500M
SystemMaxFileSize=50M
MaxRetentionSec=1month
