# Bound the journal's RAM use.
#
# The journal is VOLATILE here and that is podman's doing, not ours:
# --systemd=always mounts a tmpfs over /var/log/journal, so it sits in
# RAM on top of the /var host bind and dies with every container
# recreation (`journalctl --list-boots` shows exactly one boot, and
# /srv/<name>/var/log/journal does not exist host-side).
#
# That tmpfs is sized at half of RAM - 31 GB on a 64 GB box - and
# journald's default ceiling is 10% of the filesystem it sits on, so an
# unbounded journal could hold ~3 GB of RAM hostage. 500M is months of
# a daily driver's logs at a fraction of that.
#
# Both knobs on purpose: SystemMaxUse governs /var/log/journal (which
# exists, so journald treats it as system storage) and RuntimeMaxUse
# /run/log/journal, so the cap holds whichever path is in play - today
# and if the journal is ever bound through to the host for real.

[Journal]
SystemMaxUse=500M
RuntimeMaxUse=500M
SystemMaxFileSize=50M
