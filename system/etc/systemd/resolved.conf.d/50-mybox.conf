# Force-set upstream DNS servers — Google primary, Cloudflare fallback.
#
# Why baked in (not DNS= in the quadlet): podman's --dns flag writes
# to /etc/resolv.conf via a bind mount, but netavark's DHCP plugin
# can override it with the LAN-DHCP-supplied DNS (which on a
# tailscale-equipped host points back at the host's stub resolver,
# unreachable from inside the container).
#
# systemd-resolved + NSS `resolve` bypass /etc/resolv.conf entirely:
# apps query resolved via DBus, resolved talks to the upstreams below.

[Resolve]
DNS=8.8.8.8 8.8.4.4 1.1.1.1 1.0.0.1
FallbackDNS=8.8.4.4 1.0.0.1
DNSStubListener=yes
DNSSEC=no
