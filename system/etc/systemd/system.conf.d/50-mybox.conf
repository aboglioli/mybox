# Mybox systemd-as-PID-1 tunables. Reasonable defaults for a
# container — short shutdown timeout (no real hardware to coordinate),
# disabled coredumps (don't persist crash data in container state).

[Manager]
DefaultTimeoutStopSec=15s
DefaultTimeoutStartSec=30s
DefaultRestartSec=2s
DumpCore=no
CrashShell=no
