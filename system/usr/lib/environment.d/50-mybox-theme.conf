# Wayland-native defaults for Qt and Electron apps..
#
# QT_QPA_PLATFORM=wayland;xcb       Qt apps prefer Wayland; fall
#                                   back to X11 if no Wayland socket
# QT_WAYLAND_DISABLE_WINDOWDECORATION=1
#                                   Compositor draws decorations; Qt
#                                   stays compositor-consistent
# ELECTRON_OZONE_PLATFORM_HINT=auto  Electron auto-detects Wayland
#                                   (VS Code, Discord, etc.)
# GTK_THEME=Adwaita-dark            sensible dark default; override
#                                   per-app via /etc/profile.d if you
#                                   want a different system theme

QT_QPA_PLATFORM=wayland;xcb
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
ELECTRON_OZONE_PLATFORM_HINT=auto
GTK_THEME=Adwaita-dark
