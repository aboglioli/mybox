# multi-user.target drop-in — /usr-side wiring for core mybox services.
#
# Same rationale as sysinit.target.d/50-mybox-state.conf: on the FIRST
# boot with an empty persistent /etc bind, the preset symlinks under
# /etc/systemd/system don't exist yet. Wants= from /usr keeps the core
# service set starting on that boot; from the second boot on the
# seeded /etc presets take over (double Wants= is harmless).
[Unit]
Wants=sshd.service systemd-networkd.service systemd-resolved.service
Wants=mybox-user-setup.service mybox-linger.service
Wants=flatpak-setup.service proc-unmask.service
