# multi-user.target drop-in for nested libvirt/qemu inside mybox.
#
# virtqemud.service is the QEMU/KVM driver daemon. Its socket
# auto-spawns it on first client connect; this Upholds= line
# forces it active at boot so virsh/virt-manager work without
# warming up the socket first.
#
# Only effective when libvirt is installed inside the container.
[Unit]
Upholds=virtqemud.service
