# sockets.target drop-in — auto-start system podman socket activator.
#
# Upholds= (vs static .wants/ symlink) means systemd re-evaluates on
# `daemon-reload`, so the socket starts even after a config refresh
# without a target restart.
#
# podman.socket is socket-activated: the kernel queues the socket
# from boot, first client request spawns podman.service, daemon
# idles back out. No need to Upholds= the service itself.
#
# Note: mybox doesn't ship incus inside, so myosi's `incus.socket`
# is dropped from the Upholds list. Add it back via drop-in if you
# nest incus inside.
[Unit]
Upholds=podman.socket
