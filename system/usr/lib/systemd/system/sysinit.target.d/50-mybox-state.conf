# sysinit.target drop-in — /usr-side wiring for the state services.
#
# CRITICAL for the persistent-/etc first boot: with an EMPTY /etc bind
# the preset-generated enablement symlinks (which live in /etc/systemd/
# system) do not exist yet, so nothing in /etc can pull these units in.
# This drop-in ships in /usr, survives an empty /etc, and guarantees
# the seed services run — mybox-etc-seed then populates /etc and every
# later boot is fully normal.
[Unit]
Wants=mybox-etc-seed.service mybox-var-seed.service mybox-usr-overlay.service
