# systemd-networkd and all its sockets run unmasked under every runtime.
# systemd-networkd-wait-online, however, cannot succeed under podman: the
# runtime owns eth0 (see ../../network/80-mybox-eth0.network, scoped
# Virtualization=!podman), so networkd manages NO link, and wait-online
# then blocks network-online.target for its full timeout (~75s boot
# stall) waiting for a link that will never come online under its watch.
# netavark already brought the network up before PID 1, so waiting is
# pointless here. Skip ONLY under podman; incus / nspawn / lxc (where
# networkd manages eth0/host0 and reaches "configured" via DHCP) run it.
[Unit]
ConditionVirtualization=!podman
