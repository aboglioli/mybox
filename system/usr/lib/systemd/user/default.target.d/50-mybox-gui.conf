# User default.target drop-in — client-of-host GUI wiring.
#
# mybox-host-sockets.service  relink /mnt/host/* → XDG_RUNTIME_DIR so
#                             wayland/pulse/pipewire + flatpak find them.
# mybox-xwayland.service      in-container Xwayland → DISPLAY=:0 (needs
#                             xorg-xwayland + xwayland-satellite).
#
# Wants=, not Upholds=. Both self-gate on ConditionPathExistsGlob=/mnt/host/*,
# and a condition-skipped start leaves the unit inactive — so under Upholds=
# the headless case (no host binds) retries forever instead of being the
# no-op it looks like. Nothing is lost: mybox-xwayland already has
# Restart=on-failure, and mybox-host-sockets is a RemainAfterExit=yes oneshot.
#
# 50-mybox-desktop.conf keeps Upholds= legitimately — wireplumber.service is
# unconditioned and stays active for the whole session.
[Unit]
Wants=mybox-host-sockets.service mybox-xwayland.service
