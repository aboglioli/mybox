# User default.target drop-in — resume the user's --restart=always
# nested containers after a boot (the outer quadlet recreates the
# mybox container on every restart; podman-restart applies the
# restart policy to the persisted container objects). System-scope
# counterpart is `enable podman-restart.service` in the preset.
#
# Upholds= (vs a static .wants/ symlink) so it applies without any
# per-user `systemctl --user enable`.
[Unit]
Upholds=podman-restart.service
