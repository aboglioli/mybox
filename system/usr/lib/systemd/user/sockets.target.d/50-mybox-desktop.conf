# User-scope sockets.target drop-in — auto-start audio + portal
# infrastructure for the user's session.
#
# pipewire.socket             core audio/video pipeline
# pipewire-pulse.socket       PulseAudio compat for legacy apps
# gnome-keyring-daemon.socket secret-storage (libsecret consumers:
#                             GNOME apps, gh CLI, git credential
#                             managers, NetworkManager-applet, etc.)
#
# Same pattern as myosi's desktop profile. Only effective when the
# respective packages are installed inside the container.
#
# CLIENT-OF-HOST caveat (incus/nspawn gui): a nested pipewire here has no
# host audio behind it — it creates an EMPTY /run/user/1000/pipewire-0
# that shadows the host socket (linked by mybox-host-sockets.service) and
# yields silence. Those containers use the HOST's Pulse socket
# (PULSE_SERVER, see environment.d/gui.conf), so mask the nested daemon:
#   systemctl --user mask pipewire.socket pipewire.service
# pipewire.socket/pipewire-pulse.socket here are for a SELF-CONTAINED
# audio stack (compositor-inside / desktop mode with /dev/snd bound).
[Unit]
Upholds=pipewire.socket pipewire-pulse.socket gnome-keyring-daemon.socket
