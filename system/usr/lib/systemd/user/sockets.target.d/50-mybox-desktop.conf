# Auto-start user audio + secret-storage sockets. Effective only when
# the packages are installed inside.
#
# pipewire sockets here are for a SELF-CONTAINED audio stack
# (50-desktop.conf compositor-inside with /dev/snd). A client-of-host
# container (10-gui.conf) uses the host's Pulse socket instead — mask
# the nested daemon there:
#   systemctl --user mask pipewire.socket pipewire.service
[Unit]
Upholds=pipewire.socket pipewire-pulse.socket gnome-keyring-daemon.socket
