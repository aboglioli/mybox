# Pre-declare supplementary groups so they exist before
# mybox-user-setup.service creates the login user at boot.
#
# NO wheel GID pin: Arch's systemd ships wheel in
# /usr/lib/sysusers.d/basic.conf, which sorts earlier — a `g wheel 10`
# line here is reported as a conflict and IGNORED, so the pin never
# applied (wheel is 998 on Arch). Group membership, not the numeric
# GID, is what sudoers/%wheel checks.
#
# video / render / input / kvm / audio — assigned dynamically.
# libvirt — created by libvirt-daemon's own sysusers.d at install
#   time (and by user-setup as fallback). NOT declared here to avoid
#   GID conflict.

g video       -  -
g render      -  -
g input       -  -
g kvm         -  -
g audio       -  -

# qemu — same "exists before the thing that needs it" rule as the
# groups above, for a FILE owner rather than a member: tmpfiles.d/
# libvirt.conf declares /var/lib/libvirt/images as qemu:qemu, and on a
# box where libvirt is not (yet) installed that line failed every boot
# with "Failed to resolve user 'qemu': Unknown user" and left the
# directory uncreated. Installing libvirt later is unaffected — its own
# sysusers entry is a no-op once the user exists.
u qemu        -  "QEMU/libvirt disk images"
