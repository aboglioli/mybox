# libvirt storage layout. Uses upstream-canonical /var/lib/libvirt
# so stock SELinux/AppArmor virt rules apply without local policy
# patches. Same paths as myosi's virt profile.
#
#   /var/lib/libvirt/images   qemu:qemu  — 'default' pool, qcow2 disks
#   /var/lib/libvirt/isos     root:root  — 'isos' pool, ISO install media
#
# Per-VM disk files get dynamic svirt_image_t labels from libvirt
# at VM start, overriding the parent dir label for that inode.
d /var/lib/libvirt/images 2775 qemu qemu -
d /var/lib/libvirt/isos   0755 root root -
