# Mybox runtime state. Only entries nothing else creates.
#
# Deliberately NOT here, because their own consumer creates them with the
# identical mode and owner (verified):
#   /var/lib/mybox/.marks  flatpak-setup does `mkdir -p "${MARK%/*}"`
#   /var/lib/flatpak       `flatpak remote-add --system` creates it 0755 root
#   /srv/users             user-setup's `install -d` (parents land 0755 root)
#   /var/lib/mybox         a parent; tmpfiles creates missing parents itself
#
# /var/lib/containers/users  rootless podman per-user storage roots.
#                            The image ships NO containers config — podman
#                            runs on its packaged defaults, which put
#                            rootless storage in $HOME. This directory is
#                            here for users who prefer it out of $HOME and
#                            point graphroot at it from their own
#                            ~/.config/containers/storage.conf.
#                            The PARENT is deliberately NOT declared:
#                            containers-common ships `d %S/containers 0755`
#                            and sorts earlier, so our line lost the tie and
#                            was dropped every boot with "Duplicate line for
#                            path, ignoring" — 0755 is what has always been
#                            on disk. Nothing is lost by dropping it: the
#                            only thing 0711 would hide is the name of the
#                            users/ dir, which is 1777 and listable anyway.
# /var/lib/pacman         symlink to the image-resident pacman db
#                         (moved to /usr at build, see Containerfile)
#                         so db and files rebase together through the
#                         /usr overlay. L+ replaces a stale db DIRECTORY
#                         left in a persistent /var by older images.
#

d /var/lib/containers/users  1777 root root -
L+ /var/lib/pacman           -    -    -    - ../../usr/lib/pacman
