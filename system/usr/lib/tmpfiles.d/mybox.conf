# Mybox runtime state directories. Created early in boot so
# marker-gated oneshots (flatpak-setup, etc.) can deposit their
# /var/lib/mybox/.marks/*.done flags without race.
#
# /var/lib/mybox          parent state dir
# /var/lib/mybox/.marks   marker files for run-once setup services
# /var/lib/flatpak        system-wide flatpak installs (created by
#                         flatpak package too, declared here for early
#                         availability)
# /var/lib/containers/users  rootless podman per-user storage roots
#                            (referenced by storage.conf
#                            rootless_storage_path = ".../users/$UID")
# /srv/users              shared per-user data outside $HOME (matches
#                         myosi pattern)

d /var/lib/mybox             0755 root root -
d /var/lib/mybox/.marks      0755 root root -
d /var/lib/flatpak           0755 root root -
d /var/lib/containers        0711 root root -
d /var/lib/containers/users  1777 root root -
d /srv/users                 0755 root root -
