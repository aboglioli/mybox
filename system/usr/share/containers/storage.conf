# Mybox container storage configuration for NESTED podman (the podman
# that runs INSIDE mybox). Effective path: /usr/share/containers/
# storage.conf — the vendor tier of the containers-storage.conf(5)
# search path. User override via /etc/containers/storage.conf still
# works at runtime.
#
# rootless_storage_path keeps rootless container storage OUT of the
# user's home. This is REQUIRED for the systemd-homed model: an
# encrypted, fixed-size home must not be consumed by images, and homed's
# idmapped mount maps only the user's stable UID — podman's subuid pool
# (100000+) has no translation there, so storing under $HOME throws
# EOVERFLOW on lchown. Same intent as myosi's host storage.conf; the
# per-user tree /var/lib/containers/users is created 1777 by
# tmpfiles.d/mybox.conf so each user owns its own subdir.
#
# Divergence from myosi's file, forced by this being a CONTAINER on
# podman 5.8.3 (Arch) rather than the myosi host:
#   * NO graphroot/runroot. podman 5.8.3 lets an explicit graphroot
#     OVERRIDE rootless_storage_path ("using graphroot only,
#     rootless_storage_path is deprecated") and an explicit runroot
#     sends rootless at root-owned /run/containers/storage → EPERM.
#     Omitting both lets podman pick the right per-scope defaults:
#       root     → /var/lib/containers/storage  + /run/containers/storage
#       rootless → /var/lib/containers/users/$UID + /run/user/$UID/...
#     (root's default graphroot equals myosi's explicit value, so
#     rootful behaviour is unchanged.)
#   * NO additionalimagestores. myosi bakes pre-pulled images into
#     /usr/lib/containers/storage and points podman at it read-only;
#     mybox bakes nothing there, and an empty/absent store makes rootless
#     podman fail trying to create its lock dir inside a root-owned path.

[storage]
driver = "overlay"
rootless_storage_path = "/var/lib/containers/users/$UID"

[storage.options.pull_options]
# Pull only modified blocks from zstd:chunked images; full-pull
# fallback when the registry doesn't support it. Safe everywhere.
enable_partial_images = "true"

[storage.options.overlay]
mountopt = "nodev,metacopy=on"
