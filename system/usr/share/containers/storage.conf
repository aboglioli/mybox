# Storage config for NESTED podman (the podman running INSIDE mybox).
# Vendor tier of the containers-storage.conf(5) search path; user
# override via /etc/containers/storage.conf still works.
#
# Goal: root uses the stock /var/lib/containers/storage, and ONLY
# rootless users are relocated to /var/lib/containers/users/$UID —
# keeping images out of $HOME, which on a mybox host is a plain bind of
# fixed size and, on the sibling myosi host, an encrypted homed volume
# whose idmapped mount cannot translate podman's subuid pool (100000+)
# and throws EOVERFLOW on lchown. The per-user tree is created 1777 by
# tmpfiles.d/mybox.conf so each user owns its subdir.
#
# NO graphroot/runroot on purpose, and this is version-specific.
# Verified on the podman 6.1.0 in this image: with rootless_storage_path
# alone, root already resolves to /var/lib/containers/storage and
# rootless to users/$UID — exactly the wanted split. Setting graphroot
# as well makes podman 6 announce
#
#   "Both rootless_storage_path and graphroot are set, using graphroot
#    setting only, rootless_storage_path is deprecated"
#
# and apply graphroot to BOTH scopes, after which rootless dies with
#   Error: cannot evaluate symlinks on DB run root path
#          "/run/containers/storage": permission denied
#
# The sibling myosi host needs the opposite (explicit graphroot) because
# its podman is 5.8.4, where root DOES fall through to users/0. Do not
# sync the two files blindly — check the podman version first.

[storage]
driver = "overlay"
rootless_storage_path = "/var/lib/containers/users/$UID"

[storage.options.pull_options]
# Pull only modified blocks from zstd:chunked images; full-pull
# fallback when unsupported.
enable_partial_images = "true"

# No metacopy=on: the kernel disables metacopy on rootless userxattr
# overlay mounts (privilege-escalation guard), so containers/storage
# would strip it and log "Ignoring global metacopy option" on every
# command.
[storage.options.overlay]
mountopt = "nodev"
